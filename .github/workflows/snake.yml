name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write   # ✅ REQUIRED

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ✅ Fix Node warning

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Masood0319
          outputs: dist/snake.svg

      - name: Deploy snake
        run: |
          mkdir temp
          cd temp

          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/YOUR_USERNAME/YOUR_USERNAME.git
          
          git checkout -b output
          cp ../dist/snake.svg .

          git add .
          git commit -m "update snake" || echo "no changes"
          git push origin output --force
